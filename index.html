<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuidar Perto — Entrar</title>
<link rel="stylesheet" href="css/estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/navegacao.js"></script>
</head>
<body>
<div class="pagina">

  <div class="cabecalho">
    <h1>Cuidar Perto</h1>
  </div>

  <!-- Tela de login: aparece se não houver sessão -->
  <div id="tela-login">
    <p class="ajuda" style="margin-bottom: 20px;">Entre com o e-mail cadastrado para você como cuidador(a).</p>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">
    </div>

    <p id="erro-login" class="mensagem-erro" style="display:none;"></p>

    <button class="botao-primario" onclick="entrar()">Entrar</button>
  </div>

  <!-- Tela de seleção de idoso: aparece após login -->
  <div id="tela-selecao" style="display:none;">
    <div id="nav-topo" class="nav-topo"></div>
    <p class="subtitulo" style="margin-bottom: 16px;">Quem você vai registrar hoje?</p>
    <ul class="lista-idosos" id="lista-idosos"></ul>
    <a href="cadastro.html" class="botao-secundario" style="text-align:center; text-decoration:none; display:block;">+ Cadastrar novo idoso</a>
  </div>

</div>

<script>
  async function entrar() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const erro = document.getElementById("erro-login");
    erro.style.display = "none";

    const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
    if (error) {
      erro.textContent = "Não foi possível entrar. Confira e-mail e senha.";
      erro.style.display = "block";
      return;
    }
    mostrarSelecaoDeIdosos();
  }

  async function mostrarSelecaoDeIdosos() {
    document.getElementById("tela-login").style.display = "none";
    document.getElementById("tela-selecao").style.display = "block";
    montarNavegacao([]);

    // Busca os idosos vinculados ao cuidador logado.
    // Depende da tabela "cuidadores_idosos" (ver README.md).
    const { data: { session } } = await supabase.auth.getSession();
    const { data, error } = await supabase
      .from("cuidadores_idosos")
      .select("idoso_id, idosos(id, nome)")
      .eq("cuidador_id", session.user.id);

    const lista = document.getElementById("lista-idosos");
    if (error || !data || data.length === 0) {
      lista.innerHTML = `<li>Nenhum idoso cadastrado ainda.</li>`;
      return;
    }

    lista.innerHTML = data.map(v => `
      <li>
        <a href="registro-diario.html?idoso=${v.idosos.id}">${v.idosos.nome}</a>
      </li>
    `).join("");
  }

  // Ao carregar a página, verifica se já existe sessão ativa
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) mostrarSelecaoDeIdosos();
  })();
</script>

</body>
</html>
